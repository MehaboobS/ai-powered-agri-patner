# =========================================================
# Render Blueprint Specification for Bharath Krishi
# Deploy with 1-click on https://render.com
# =========================================================
databases:
  # 1. Managed PostgreSQL Database (Free Tier)
  - name: bharath-agri-db
    databaseName: agri
    user: agriuser
    plan: free
    region: oregon

services:
  # 2. FastAPI Backend Service (Containerized)
  - type: web
    name: bharath-agri-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bharath-agri-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash

  # 3. React + Vite Frontend (Global CDN Static Site)
  - type: web
    name: bharath-agri-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://bharath-agri-backend.onrender.com
