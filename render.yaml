# =========================================================
# Render Blueprint Specification for Bharath Krishi
# Deploy with 1-click on https://render.com
# =========================================================
databases:
  # 1. Managed PostgreSQL Database (Free Tier)
  - name: bharath-agri-db
    databaseName: agri
    user: agriuser
    plan: free
    region: oregon

services:
  # 2. FastAPI Backend Service (Containerized)
  - type: web
    name: bharath-agri-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bharath-agri-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false

  # 3. React + Vite Frontend (Global CDN Static Site)
  - type: web
    name: bharath-agri-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: bharath-agri-backend
          property: host
